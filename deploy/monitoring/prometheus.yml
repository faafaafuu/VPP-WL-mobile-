global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/vpn-router-alerts.yml

scrape_configs:
  - job_name: vpn-router-api
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.example.com/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: vpn-router-nodes
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - eu1.vpn.example.com:443
          - eu2.vpn.example.com:8443
          - us1.vpn.example.com:443
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
