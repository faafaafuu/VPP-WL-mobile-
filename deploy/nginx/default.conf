# HTTP mode — works out of the box without a domain or SSL certificate.
# Run ./setup.sh --ssl your.domain.com admin@your.domain.com to switch to HTTPS.
server {
    listen 80;
    server_name _;

    client_max_body_size 256k;

    # ACME challenge directory — used by certbot even before SSL is set up
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
    }
}
