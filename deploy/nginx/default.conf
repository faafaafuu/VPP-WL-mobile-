# Primary domain: mandanator.ru (Let's Encrypt). The sslip.io mirror stays as a
# legacy alias; direct-IP plain HTTP keeps working for DPI-restricted RU ISPs.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Domain over plain HTTP → redirect to HTTPS (the real domain is not DPI-blocked).
server {
    listen 80;
    server_name mandanator.ru www.mandanator.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mandanator.ru$request_uri;
    }
}

# Direct IP (and anything else) over plain HTTP serves the app directly:
# http://84.247.166.53 must keep working for ISPs that block everything else.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 256k;

    # ACME challenge directory — must stay on plain HTTP for certbot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name mandanator.ru www.mandanator.ru;

    ssl_certificate     /etc/letsencrypt/live/mandanator.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mandanator.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 256k;

    location / {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
    }
}

# Legacy sslip.io alias (old https links)
server {
    listen 443 ssl;
    http2 on;
    server_name 84.247.166.53.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/84.247.166.53.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/84.247.166.53.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 256k;

    location / {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
    }
}

# Twenty CRM on standard port 443 via SNI. Backend: host port 3010, plain HTTP.
# crm.mandanator.ru is added by deploy once its DNS record + cert exist.
server {
    listen 443 ssl;
    http2 on;
    server_name crm-84-247-166-53.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/crm-84-247-166-53.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm-84-247-166-53.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32m;

    location / {
        proxy_pass         http://84.247.166.53:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
