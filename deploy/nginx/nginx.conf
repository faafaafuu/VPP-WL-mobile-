user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

# TCP-level SNI splitter on 443: VPN clients use the Reality decoy SNIs and are
# forwarded raw to the x-ui inbounds; everything else (the website / CRM) is
# terminated by the HTTPS vhosts on the internal 8443 listener. This lets the
# VPN share port 443 with the site, so ISPs that only allow 443 still connect.
stream {
    map $ssl_preread_server_name $vpn_upstream {
        www.samsung.com     84.247.166.53:2083;
        www.intel.com       84.247.166.53:42480;
        dl.google.com       84.247.166.53:57262;
        default             127.0.0.1:8443;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $vpn_upstream;
        proxy_timeout 300s;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
