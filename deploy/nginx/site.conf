# Страница ехала 27 КБ в открытую. Сжатие само по себе не лечит обрыв на
# мобильных, но сокращает всё в четыре-пять раз — и это правильно в любом
# случае, а не только пока идёт разбирательство.
gzip              on;
gzip_vary         on;
gzip_comp_level   5;
gzip_min_length   256;
gzip_proxied      any;
gzip_types        text/plain text/css text/xml application/json application/javascript
                  application/xml image/svg+xml application/rss+xml;

# В стандартном логе нет ни домена, ни версии TLS — а именно по ним
# различаются соединения, которые доходят, и которые обрываются.
# $remote_addr — уже подменённый настоящий IP клиента, поэтому по нему не
# отличить проход через Cloudflare от прямого соединения. $realip_remote_addr
# показывает, кто реально подключился, а cf-ray есть только у Cloudflare.
log_format probe '$remote_addr peer=$realip_remote_addr cf=$http_cf_ray $host '
                 '"$request" $status $body_bytes_sent '
                 'tls=$ssl_protocol/$ssl_cipher rt=$request_time';
# Единственный TLS-фронт машины. Три вещи за одним 443:
#   cleohop.ru        — продающий сайт, проксируется на api
#   mandanator.ru     — маскировочная страница
#   всё остальное (_) — та же маскировка; VPN живёт на секретном пути под ней
#
# Порядок важен: catch-all обязан быть default_server, иначе на него уедет
# и cleohop.ru тоже.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP: только ACME и редирект на HTTPS -----------------------------------

# Запасной вход по голому IP. Именно по HTTP, а не по HTTPS: сертификата на
# IP-адрес не выдают, по HTTPS браузер показал бы предупреждение. Плюс без
# TLS-рукопожатия ответ короче на пару килобайт, а мобильный путь до нас
# обрывается примерно на четырёх.
server {
    listen 80;
    listen [::]:80;
    server_name 84.247.166.53 "2a02:c207:2321:3709::1";

    client_max_body_size 256k;
    access_log /var/log/nginx/access.log probe;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /size/ {
        alias /var/www/probe/;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Продление сертификатов идёт webroot-методом: плагин --nginx правил бы
    # конфиг на хосте, которого у контейнера нет.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: продающий сайт ---------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cleohop.ru www.cleohop.ru;

    ssl_certificate     /etc/letsencrypt/live/cleohop.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cleohop.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 256k;
    access_log /var/log/nginx/access.log probe;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Диагностика: ответы фиксированного размера. Нужны, чтобы отделить
    # блокировку домена от потери больших пакетов по пути.
    location /size/ {
        alias /var/www/probe/;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}

# --- HTTPS: маскировка и XHTTP-транспорт под ней -----------------------------

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name mandanator.ru edge.mandanator.ru _;

    ssl_certificate     /etc/letsencrypt/live/mandanator.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mandanator.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/access.log probe;

    root  /var/www/decoy;
    index index.html;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location /3be8be5274af6f0a4e35 {
        proxy_redirect off;
        proxy_pass http://xray-xhttp:18080;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_buffering         off;
        proxy_request_buffering off;
    }

    # Диагностика: ответы фиксированного размера. Нужны, чтобы отделить
    # блокировку домена от потери больших пакетов по пути.
    location /size/ {
        alias /var/www/probe/;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
