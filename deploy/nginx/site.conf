# Единственный TLS-фронт машины. Три вещи за одним 443:
#   cleohop.ru        — продающий сайт, проксируется на api
#   mandanator.ru     — маскировочная страница
#   всё остальное (_) — та же маскировка; VPN живёт на секретном пути под ней
#
# Порядок важен: catch-all обязан быть default_server, иначе на него уедет
# и cleohop.ru тоже.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP: только ACME и редирект на HTTPS -----------------------------------

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Продление сертификатов идёт webroot-методом: плагин --nginx правил бы
    # конфиг на хосте, которого у контейнера нет.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: продающий сайт ---------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cleohop.ru www.cleohop.ru;

    ssl_certificate     /etc/letsencrypt/live/cleohop.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cleohop.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 256k;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}

# --- HTTPS: маскировка и XHTTP-транспорт под ней -----------------------------

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name mandanator.ru edge.mandanator.ru _;

    ssl_certificate     /etc/letsencrypt/live/mandanator.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mandanator.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/decoy;
    index index.html;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location /3be8be5274af6f0a4e35 {
        proxy_redirect off;
        proxy_pass http://xray-xhttp:18080;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_buffering         off;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
