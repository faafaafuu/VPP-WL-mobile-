# Единый прод: сайт, TLS-фронт, обе VPN-ноды и релей цепи.
#
# Сертификаты берутся с хоста (/etc/letsencrypt), где их продлевает системный
# certbot. Раньше hysteria2 читал их из тома certbot-conf, куда никто ничего
# не обновлял: там лежал сертификат, истекающий 5 октября, при живом хостовом
# до 24 ноября — нода бы просто перестала пускать клиентов.
#
# База лежит каталогом на хосте, а не в именованном томе. Том уже однажды
# разошёлся с боевой базой на два месяца, и `compose up` поднял бы приложение
# с июльскими заказами. Каталог видно, его можно забэкапить и нельзя перепутать.
name: vpn-router

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: vpn-router-backend:latest
    env_file:
      - ${VPN_ROUTER_ENV_FILE:-.env}
    environment:
      VPN_ROUTER_REPOSITORY: sqlite
      VPN_ROUTER_SQLITE_PATH: data/vpn-router.db
      VPN_ROUTER_HOST: 0.0.0.0
      VPN_ROUTER_PORT: "8080"
    volumes:
      - ./backend/data:/app/backend/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/cloudflare-realip.conf:/etc/nginx/conf.d/cloudflare-realip.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/html:/var/www/html:ro
      - /var/www/decoy:/var/www/decoy:ro
      - /var/www/probe:/var/www/probe:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # UDP/QUIC-нода. Salamander-обфускация против шейпинга ТСПУ.
  hysteria2:
    image: tobyxdd/hysteria:latest
    command: ["server", "-c", "/etc/hysteria/config.yaml"]
    ports:
      - "36712:36712/udp"
    volumes:
      - /etc/letsencrypt:/certs:ro
      - ./hysteria/config.yaml:/etc/hysteria/config.yaml:ro
    restart: unless-stopped

  # Приёмник цепи: сюда ходит московская нода, отсюда трафик выходит в Германии.
  xray-relay:
    image: ghcr.io/xtls/xray-core:latest
    command: ["run", "-c", "/etc/xray/config.json"]
    ports:
      - "11081:11081"
    volumes:
      - ./deploy/xray/relay.json:/etc/xray/config.json:ro
    restart: unless-stopped

  # XHTTP-транспорт за маскировочным сайтом: nginx отдаёт его по секретному
  # пути, снаружи порт не публикуется вовсе.
  xray-xhttp:
    image: ghcr.io/xtls/xray-core:latest
    command: ["run", "-c", "/etc/xray/config.json"]
    expose:
      - "18080"
    volumes:
      - ./deploy/xray/xhttp.json:/etc/xray/config.json:ro
    restart: unless-stopped
