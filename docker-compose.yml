services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: vpn-router-backend:latest
    env_file:
      - ${VPN_ROUTER_ENV_FILE:-.env}
    environment:
      VPN_ROUTER_REPOSITORY: sqlite
      VPN_ROUTER_SQLITE_PATH: data/vpn-router.db
      VPN_ROUTER_HOST: 0.0.0.0
      VPN_ROUTER_PORT: "8080"
    volumes:
      - backend-data:/app/backend/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --quiet --webroot --webroot-path /var/www/certbot 2>/dev/null || true;
          sleep 12h & wait $${!};
        done"
    restart: unless-stopped

  health-check:
    image: vpn-router-backend:latest
    profiles: ["jobs"]
    env_file:
      - ${VPN_ROUTER_ENV_FILE:-.env}
    environment:
      VPN_ROUTER_REPOSITORY: sqlite
      VPN_ROUTER_SQLITE_PATH: data/vpn-router.db
    volumes:
      - backend-data:/app/backend/data
    command: ["python3", "-m", "app.cli.health_check"]
    restart: "no"

  payment-watch:
    image: vpn-router-backend:latest
    profiles: ["jobs"]
    env_file:
      - ${VPN_ROUTER_ENV_FILE:-.env}
    environment:
      VPN_ROUTER_REPOSITORY: sqlite
      VPN_ROUTER_SQLITE_PATH: data/vpn-router.db
    volumes:
      - backend-data:/app/backend/data
    command: ["python3", "-m", "app.cli.payment_watch"]
    restart: "no"

volumes:
  backend-data:
  certbot-conf:
  certbot-www:
